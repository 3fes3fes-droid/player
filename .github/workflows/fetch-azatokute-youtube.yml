name: Export Azatokute YouTube IDs

on:
  push:
    branches:
      - chatgpt-yt-fetch

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-yt-fetch
      - name: Export verified ID list
        uses: actions/upload-artifact@v4
        with:
          name: azatokute-youtube-all-ids
          path: azatokute_youtube_all_ids.json
          if-no-files-found: error
